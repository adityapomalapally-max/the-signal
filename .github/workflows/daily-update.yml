name: Daily Data Update

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM ET / 5:00 AM CT)
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Run data update script
        run: node scripts/update-data.js
      
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "The Signal Bot"
          git config user.email "bot@thesignal.app"
          git add data/
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "Automated data update: ${DATE}

          - Player statuses synced from Sleeper API
          - Trending players cached
          - ESPN news cached"
          git push
