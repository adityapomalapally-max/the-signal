name: Daily Data Update

on:
  schedule:
    # THE FULL BUILD, and the only one that touches nflverse. 11:00 UTC is
    # 6:00 AM ET, which measured against nflverse's own publishing schedule is
    # the right hour: they rebuild play-by-play after Thursday night (05:30 UTC
    # Fri), the early window (22:00 UTC Sun), the late window (00:05 UTC Mon),
    # SNF (05:30 UTC Mon) and MNF (05:30 UTC Tue) — all overnight, so this run
    # has the weekend by Monday morning and Monday night's game by Tuesday.
    - cron: '0 11 * * *'

    # LIGHT REFRESHES — Sleeper statuses, trending, news, and the boards built
    # from them. Seconds, no CSVs, and scripts/lib/cadence.js turns every one of
    # them into a no-op out of season, so there is no month range here to be
    # remembered and updated every year.
    #
    # Sunday 16:30 UTC = 12:30 ET. Inactives are official ninety minutes before
    # kickoff, so this is the first build of the week that knows who is playing.
    - cron: '30 16 * * 0'
    # Sunday 22:30 UTC = 18:30 ET. What the early window did to people, before
    # the late games and Sunday night.
    - cron: '30 22 * * 0'
    # Tuesday 23:00 UTC = 19:00 ET. Claims go in on Tuesday night and process on
    # Wednesday morning, so this is when the wire is actually read.
    - cron: '0 23 * * 2'
    # Thursday 23:00 UTC = 19:00 ET. TNF inactives, an hour before kickoff.
    - cron: '0 23 * * 4'

  workflow_dispatch:
    inputs:
      tier:
        description: 'full = everything including nflverse; light = statuses, trending and the wire'
        type: choice
        options: [full, light]
        default: full

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # WHAT KIND OF RUN IS THIS. Decided from the cron that fired rather than
      # from the clock, because GitHub delays scheduled runs and a late daily
      # build read off the wall clock would silently demote itself to a status
      # refresh and skip the day's real work.
      # The two values reach the shell as ENVIRONMENT, not as text pasted into
      # the command. Both are safe today — the schedule is one of this file's
      # own crons and `tier` is a `choice` constrained to full|light — but
      # `${{ }}` interpolated into a `run:` is substituted before the shell ever
      # sees it, so the safety is a property of the inputs rather than of the
      # step. When that stops being true it stops being visible here.
      - name: Decide what this run is
        id: plan
        env:
          RUN_SCHEDULE: ${{ github.event.schedule }}
          RUN_TIER: ${{ inputs.tier }}
        run: node scripts/lib/cadence.js --schedule "$RUN_SCHEDULE" --tier "$RUN_TIER" >> "$GITHUB_OUTPUT"

      # FULL BUILD ONLY, even though it runs first and everything reads it. It
      # downloads the nflverse rosters for the GSIS crosswalk, which makes it a
      # download rather than an API call — and a status refresh does not need
      # the pool rebuilt. update-data syncs today's statuses onto the pool that
      # is already on disk; membership moves slowly and is deliberately
      # hysteretic, so nobody joins or leaves it between Sunday morning and
      # Sunday lunchtime.
      - name: Build player pool
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-players.js

      - name: Run data update script
        if: steps.plan.outputs.tier != 'none'
        run: node scripts/update-data.js
      
      - name: Fetch nflverse player stats
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/fetch-stats.js

      - name: Fetch Next Gen Stats + snap counts
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/fetch-ngs.js

      - name: Fetch official injury reports
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/fetch-injuries.js

      # PFR advanced splits: what a player DID versus what was done to him —
      # yards before/after the catch, drops, broken tackles, pressure faced. The
      # join is gsis_id -> pfr_id through nflverse's own crosswalk, never by name.
      - name: Fetch PFR advanced splits
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/fetch-advstats.js

      # Depth chart position and combine testing. The depth chart says where a
      # player sits on his OWN team, which no volume stat says; the combine
      # percentiles replace hand-typed athletic numbers with generated ones.
      - name: Fetch depth charts and combine testing
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/fetch-context.js

      - name: Build aggregate return-to-play curves
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-injury-curves.js

      # Reads the injury reports and the curves the step above just built, so it
      # has to follow them.
      - name: Build the injury body map
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-injury-anatomy.js

      - name: Fetch average draft position
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/fetch-adp.js

      # THE BOARD CARRIES A LIVE INJURY FLAG AND WAS NOT BEING REBUILT. It was
      # run by hand, so the flag beside a player's missed-time case was as fresh
      # as the last time somebody remembered — four days stale when this was
      # found, with nothing anywhere to say so. Ordering cannot drift into
      # Adi's ranks by running it: rankings-manual.json wins outright, and
      # availability moves the downside, never the rank.
      #
      # After update-data (statuses) and fetch-stats (the weekly game logs the
      # availability figure is computed from), and BEFORE build-ros and
      # build-history, which both read what it writes.
      - name: Build rankings
        if: steps.plan.outputs.tier != 'none'
        run: node scripts/build-rankings.js

      # Writes nothing until the season starts, by design: a rest-of-season
      # projection before any football has been played is the season projection
      # under another name.
      - name: Build rest-of-season projections
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-ros.js

      - name: Build team pages and schedule
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-teams.js

      - name: Build strength of schedule
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-sos.js

      # Reads data/weekly, which fetch-stats has already refreshed above. In
      # season this is the board that changes most from one Sunday to the next.
      - name: Build defensive matchups
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-matchups.js

      # Current season only by default — past seasons never change and each one
      # is ~70MB of participation + play-by-play. Use --all to rebuild history.
      - name: Build scheme and identity
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-scheme.js

      # AFTER build-scheme, which writes the play-by-play half, and after
      # fetch-advstats, which writes the charted half. It reads neither file —
      # both source CSVs are fetched fresh — but it publishes numbers beside
      # theirs and should not describe a different week from them.
      - name: Build the team environment
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-environment.js

      # Adds a row for any team-season that appeared; never overwrites an answer.
      - name: Scaffold play-caller rows
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-playcallers.js
      
      # After the data steps: the pool changes, and a sitemap listing yesterday's
      # players is a list of soft 404s submitted to Google.
      # Follows the pool, which only the full build changes.
      - name: Build sitemap and robots.txt
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-sitemap.js

      # Last of the data steps and before the commit, because it reads what the
      # steps above just wrote. Every other file here answers "what is true
      # today" and is then overwritten; this one is the only record that today
      # ever happened. A morning it does not run is a morning gone for good.
      - name: Append today to the history series
        if: steps.plan.outputs.tier == 'full'
        run: node scripts/build-history.js

      # A LIGHT REFRESH STILL HAS TO LOG THE EVENTS IT CAUSED. It syncs statuses,
      # and the status log is the state this script diffs against — skip it and
      # the log says Healthy while players.json says Questionable (Hand), so the
      # next real change is computed against a position that never existed. The
      # SERIES are skipped instead (--events-only), because one reading a day at
      # the same hour is what makes a delta over them mean anything.
      - name: Log the events a status refresh caused
        if: steps.plan.outputs.tier == 'light'
        run: node scripts/build-history.js --events-only

      # AFTER build-history, which appends this morning's trending line — the
      # wire reads the series to say which way a count is moving, and reading
      # it before today was written would compare yesterday with the day
      # before. Also after fetch-context, which writes the league-wide depth
      # chart the board's reasons come from.
      - name: Build the waiver wire
        if: steps.plan.outputs.tier != 'none'
        run: node scripts/build-wire.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "The Signal Bot"
          git config user.email "bot@thesignal.app"
          git add data/ sitemap.xml robots.txt
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          # THE MESSAGE HAS TO MATCH THE RUN. A light refresh touches no
          # nflverse file, and a commit claiming "stats synced from nflverse"
          # on a Sunday afternoon sends anyone reading the log looking for a
          # change that is not in it.
          if [ "${{ steps.plan.outputs.tier }}" = "light" ]; then
            git commit -m "Status refresh: ${DATE}

          - Player statuses synced from Sleeper
          - Trending adds and drops cached
          - ESPN news cached
          - Rankings flags and the waiver wire rebuilt from those
          - No nflverse data touched: this is an in-season status run"
          else
            git commit -m "Automated data update: ${DATE}

          - Player pool rebuilt from Sleeper (top 200 + curated overlay)
          - Player statuses synced from Sleeper API
          - Trending players cached
          - ESPN news cached
          - Player stats synced from nflverse"
          fi
          git push

      # The data-integrity suite has to run HERE, not only in test.yml.
      #
      # test.yml is `on: push`, and CLAUDE.md claimed that covered "the daily
      # bot's data commit, which is the commit most likely to break a rule".
      # It never did: GitHub does not trigger workflows for a push made with the
      # default GITHUB_TOKEN, which is exactly how the step above pushes. So the
      # suite written for the bot's commits had never once run against one.
      #
      # 2026-08-18 is the proof — the pool churned, player-usage.json kept rows
      # for four players who left it, and the run stayed green because nothing
      # ran. Same bargain as the two checks below: after the push, `always()`,
      # so a data rule that breaks reds the run without holding up the day's data.
      - name: Data-integrity tests
        if: always()
        run: node --test 'tests/*.test.js'

      # Last, and deliberately after the push: a broken hand-written override is
      # a silent no-op — the file claims a player is on PUP and the site shows
      # him healthy — so the run has to go red. Running it here means a typo in
      # a hand file reds the Action without holding up the day's real data.
      - name: Validate injury overrides
        if: always() && steps.plan.outputs.tier != 'none'
        run: node scripts/check-overrides.js

      # Same bargain: update-data.js swallows a dead API so the rest of the
      # pipeline still runs, and this turns that into a red run afterwards.
      - name: Check every feed reported in
        if: always() && steps.plan.outputs.tier != 'none'
        run: node scripts/check-feeds.js

      # The season rollover is the failure with no symptom: on the first Sunday
      # of the regular season every script still succeeds, the site still
      # renders, and every number on it belongs to last year. Nothing errors, so
      # nothing tells anyone. This asks the only question that matters — does the
      # data on disk contain the season the league is actually playing.
      - name: Check the data matches the season being played
        if: always() && steps.plan.outputs.tier != 'none'
        run: node scripts/check-season.js
