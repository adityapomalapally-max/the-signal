name: Daily Data Update

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM ET / 5:00 AM CT)
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Build player pool
        run: node scripts/build-players.js

      - name: Run data update script
        run: node scripts/update-data.js
      
      - name: Fetch nflverse player stats
        run: node scripts/fetch-stats.js

      - name: Fetch Next Gen Stats + snap counts
        run: node scripts/fetch-ngs.js

      - name: Fetch official injury reports
        run: node scripts/fetch-injuries.js

      - name: Build aggregate return-to-play curves
        run: node scripts/build-injury-curves.js

      - name: Fetch average draft position
        run: node scripts/fetch-adp.js

      - name: Build team pages and schedule
        run: node scripts/build-teams.js

      - name: Build strength of schedule
        run: node scripts/build-sos.js

      # Current season only by default — past seasons never change and each one
      # is ~70MB of participation + play-by-play. Use --all to rebuild history.
      - name: Build scheme and identity
        run: node scripts/build-scheme.js

      # Adds a row for any team-season that appeared; never overwrites an answer.
      - name: Scaffold play-caller rows
        run: node scripts/build-playcallers.js
      
      # After the data steps: the pool changes, and a sitemap listing yesterday's
      # players is a list of soft 404s submitted to Google.
      - name: Build sitemap and robots.txt
        run: node scripts/build-sitemap.js

      # Last of the data steps and before the commit, because it reads what the
      # steps above just wrote. Every other file here answers "what is true
      # today" and is then overwritten; this one is the only record that today
      # ever happened. A morning it does not run is a morning gone for good.
      - name: Append today to the history series
        run: node scripts/build-history.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "The Signal Bot"
          git config user.email "bot@thesignal.app"
          git add data/ sitemap.xml robots.txt
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "Automated data update: ${DATE}

          - Player pool rebuilt from Sleeper (top 200 + curated overlay)
          - Player statuses synced from Sleeper API
          - Trending players cached
          - ESPN news cached
          - Player stats synced from nflverse"
          git push

      # The data-integrity suite has to run HERE, not only in test.yml.
      #
      # test.yml is `on: push`, and CLAUDE.md claimed that covered "the daily
      # bot's data commit, which is the commit most likely to break a rule".
      # It never did: GitHub does not trigger workflows for a push made with the
      # default GITHUB_TOKEN, which is exactly how the step above pushes. So the
      # suite written for the bot's commits had never once run against one.
      #
      # 2026-08-18 is the proof — the pool churned, player-usage.json kept rows
      # for four players who left it, and the run stayed green because nothing
      # ran. Same bargain as the two checks below: after the push, `always()`,
      # so a data rule that breaks reds the run without holding up the day's data.
      - name: Data-integrity tests
        if: always()
        run: node --test 'tests/*.test.js'

      # Last, and deliberately after the push: a broken hand-written override is
      # a silent no-op — the file claims a player is on PUP and the site shows
      # him healthy — so the run has to go red. Running it here means a typo in
      # a hand file reds the Action without holding up the day's real data.
      - name: Validate injury overrides
        if: always()
        run: node scripts/check-overrides.js

      # Same bargain: update-data.js swallows a dead API so the rest of the
      # pipeline still runs, and this turns that into a red run afterwards.
      - name: Check every feed reported in
        if: always()
        run: node scripts/check-feeds.js
