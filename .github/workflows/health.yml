name: Health Report

# THE CHECK THAT RUNS WHEN NOTHING ELSE IS RUNNING.
#
# Every other check lives inside the daily build and judges the tree that build
# just wrote. That is the right place for most of them and blind to the one
# failure that actually reached readers: from 2026-08-29 the Action failed
# eleven times, committed nothing for seven days, and its own feed check
# reported "last update: 0h ago — OK" on every single run, truthfully, about a
# file that would never be committed.
#
# So this is a SEPARATE workflow on a SEPARATE schedule, and scripts/health-
# report.js asks the published site, the commit history and the Actions API
# rather than the working tree. A health check that shares a process with the
# thing it is checking is a thermometer in your own mouth.

on:
  schedule:
    # 13:00 UTC — two hours after the 11:00 full build, so it judges a settled
    # state rather than racing the thing it is reporting on.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: health-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit-age check asks GitHub rather than the clone, but the
          # season and housekeeping checks read files, and a shallow checkout is
          # all they need.
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the checks
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/health-report.js > report.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.health.outputs.exit }}
        run: |
          set -euo pipefail
          TITLE="🩺 Health report"

          # ONE LIVING ISSUE, not one per day. A new issue every morning is a
          # notification people mute inside a week; a single issue that changes
          # is a dashboard, and a comment on it is a deliberate interruption.
          NUM=$(gh issue list --state all --search "\"$TITLE\" in:title" \
                  --json number,state --limit 1 --jq '.[0].number // empty')

          {
            echo "<!-- generated by .github/workflows/health.yml — edits will be overwritten -->"
            cat report.md
            echo ""
            echo "---"
            echo "_[Re-run this check](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/health.yml) · updated automatically every day at 13:00 UTC._"
          } > body.md

          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --title "$TITLE" --body-file body.md | grep -oE '[0-9]+$')
            echo "opened #$NUM"
          else
            gh issue edit "$NUM" --body-file body.md
            echo "updated #$NUM"
          fi

          STATE=$(gh issue view "$NUM" --json state --jq .state)

          if [ "$FAILED" != "0" ]; then
            # A comment is the part that actually reaches somebody. Only on a
            # real problem — warnings update the body silently, because the
            # alarm that fires on a normal day is the one nobody reads.
            [ "$STATE" = "CLOSED" ] && gh issue reopen "$NUM"
            gh issue comment "$NUM" --body-file report.md
            echo "::error::Health check found problems — see issue #$NUM"
            exit 1
          fi

          if [ "$STATE" = "OPEN" ]; then
            gh issue comment "$NUM" --body "✅ Recovered — everything below is green again as of $(date -u '+%Y-%m-%d %H:%M UTC')."
            gh issue close "$NUM"
            echo "closed #$NUM"
          fi
