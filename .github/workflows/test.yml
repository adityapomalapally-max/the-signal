name: Tests

# The data rules in CLAUDE.md were each learned by shipping the bug once. Until
# now they were enforced by remembering. This runs them on every push, including
# the daily bot's data commit — which is the commit most likely to break them.
on:
  push:
  pull_request:
  workflow_dispatch:

# ONE AUTHORITATIVE NUMBER PER BRANCH, because the mutation gate takes about
# half an hour and four of them raced on 2026-10-02. They reported out of order
# — a run measuring a commit two behind landed after a newer one — and a stale
# 42 was within one keystroke of being recorded as the baseline. The ratchet is
# only meaningful if the number describes the tip.
#
# Cancelling a gate run is safe HERE and would not be locally: mutate.js edits
# scripts/lib/*.js in place and restores them in a `finally`, which a kill
# skips. On a runner the checkout is thrown away, so a cancelled run leaves a
# poisoned tree nobody will ever read. On a laptop it leaves one in the repo,
# which is why mutate.js heals from a note in .git before it measures.
#
# THE DATA RUN DELIBERATELY DOES NOT DO THIS. daily-update.yml and health.yml
# carry the same concurrency key with cancel-in-progress FALSE, because killing a
# half-finished data build is a different and worse thing than killing a
# measurement: it loses the day's fetches and can leave data/ half-written
# between the build steps and the commit. A test run holds nothing anybody needs.
#
# Keyed on the workflow AND the ref, so main and a branch do not cancel each
# other, and a pull_request run does not cancel the push run for the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # This job reads and never writes. Stated explicitly because the DEFAULT is
    # whatever the repository is set to, which for an older repo is read-write —
    # so a compromised step in a test run would have had a token that could push.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No dependencies and no build step: node --test is built in, which is
      # what makes a test suite affordable for a site with no package.json.
      - name: Unit and data-integrity tests
        run: node --test 'tests/*.test.js'

      - name: Validate injury overrides
        run: node scripts/check-overrides.js

      - name: Validate play-callers
        run: node scripts/check-playcallers.js

      # DOES THE SUITE ACTUALLY CHECK ANYTHING? A passing suite is not evidence
      # that the code is right; it is evidence that nothing DISAGREED. Three
      # bugs shipped in one day past green tests, because each test had been
      # written from the same wrong idea as the code it covered — the draft
      # value sign, the offseason boundary, and a CSP check that searched the
      # whole policy instead of the directive.
      #
      # This changes the code on purpose, one character at a time, and fails if
      # the suite catches fewer of those edits than it used to. Not a target: a
      # ratchet. See tests/mutation-baseline.json for why 100% is the wrong
      # thing to chase.
      - name: The suite has not got weaker
        run: node scripts/mutate.js --budget 60 --seed 7 --strict

      - name: Every script parses
        run: |
          for f in scripts/*.js scripts/lib/*.js assets/*.js; do
            node --check "$f" || exit 1
          done
